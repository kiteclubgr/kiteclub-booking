<header class="kc-instructor-mobile-header kc-mobile-session-bar">
  <div class="kc-instructor-account">
    <a class="kc-instructor-brand" href="{{url_for('instructor')}}" aria-label="KiteClub — Πρόγραμμα"><img src="{{url_for('static',filename='img/kiteclub-logo-transparent.png')}}" alt="KiteClub"></a>
    <a class="kc-instructor-name" href="{{url_for('instructor_profile')}}">{{me.name}}</a>
    <form action="{{url_for('logout')}}" method="post"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><button type="submit">Αποσύνδεση</button></form>
  </div>
  {% set ep=request.endpoint %}
  <nav class="kc-instructor-mobile-nav" aria-label="Πλοήγηση εκπαιδευτή">
    <a href="{{url_for('instructor')}}"{% if ep in ['instructor','instructor_lesson','instructor_complete_lesson'] %} aria-current="page"{% endif %}><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>Πρόγραμμα</a>
    <a href="{{url_for('instructor_students')}}"{% if ep in ['instructor_students','instructor_student_detail'] %} aria-current="page"{% endif %}><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Μαθητές</a>
    <a href="{{url_for('instructor_profile')}}"{% if ep=='instructor_profile' %} aria-current="page"{% endif %}><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Προφίλ</a>
  </nav>
</header>
<link rel="stylesheet" href="{{url_for('static',filename='instructor-mobile-admin-layout.css',v='099')}}">
