<aside class="student-portal-sidebar kc-role-sidebar" aria-label="Student sidebar">
<a class="sp-logo kc-role-logo" href="{{url_for('student_home')}}"><img src="{{url_for('static',filename='img/kiteclub-logo.png')}}" alt="KiteClub"></a>
<div class="sp-menu kc-role-menu" role="navigation" aria-label="Student navigation">
<a class="kc-role-nav-item {% if student_nav=='home' %}active{% endif %}" href="{{url_for('student_home')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span class="kc-role-label">Αρχική</span></a>
<a class="kc-role-nav-item {% if student_nav=='booking' %}active{% endif %}" href="{{url_for('student')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4.5h6M9 11h6M9 15h6"/></svg><span class="kc-role-label">Κρατήσεις</span></a>
<a class="kc-role-nav-item {% if student_nav=='lessons' %}active{% endif %}" href="{{url_for('student_profile')}}#lessons"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 10 10-5 10 5-10 5-10-5Z"/><path d="M6 12v5c4 3 8 3 12 0v-5M22 10v7"/></svg><span class="kc-role-label">Τα μαθήματά μου</span></a>
<a class="kc-role-nav-item {% if student_nav=='photos' %}active{% endif %}" href="{{url_for('student_profile')}}#photos"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span class="kc-role-label">Φωτογραφίες</span></a>
<a class="kc-role-nav-item {% if student_nav=='profile' %}active{% endif %}" href="{{url_for('student_profile')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span class="kc-role-label">Προφίλ μου</span></a>
<a class="kc-role-nav-item {% if student_nav=='messages' %}active{% endif %}" href="{{url_for('student_messages')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 8L22 6"/></svg><span class="kc-role-label">Μηνύματα</span>{% if message_unread_count %}<b class="sp-badge">{{message_unread_count}}</b>{% endif %}</a>
</div>
<div class="sp-side-art kc-role-art" aria-hidden="true"><div class="sun"></div><div class="palm"></div><div class="palm2"></div><div class="moon"></div></div>
<div class="kc-role-version" aria-label="Έκδοση εφαρμογής">KiteClub v75.2 · Sidebar v3</div>
<a class="sp-logout kc-role-logout" href="{{url_for('logout')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Αποσύνδεση</span></a>
</aside>
<script>
/* Highlight the actual section shown by Student Profile hash navigation. */
(function () {
  function syncStudentSidebar() {
    const links = document.querySelectorAll('.student-portal-sidebar .kc-role-nav-item');
    if (!links.length) return;
    const pathname = window.location.pathname.replace(/\/$/, '');
    const isProfile = pathname === '/student/profile';
    const section = isProfile && ['#photos', '#lessons'].includes(window.location.hash)
      ? window.location.hash.slice(1) : null;
    links.forEach(function(link) {
      const target = new URL(link.href, window.location.href);
      let active = false;
      if (isProfile) {
        active = section ? target.hash === '#' + section :
          (target.pathname === '/student/profile' && !target.hash);
      } else {
        active = target.pathname.replace(/\/$/, '') === pathname && !target.hash;
      }
      link.classList.toggle('active', active);
      if (active) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }
  document.addEventListener('DOMContentLoaded', syncStudentSidebar);
  window.addEventListener('hashchange', syncStudentSidebar);
})();
</script>
