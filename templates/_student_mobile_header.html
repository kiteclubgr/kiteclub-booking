<header class="kc-student-mobile-header">
  <div class="kc-student-account">
    <a class="kc-student-brand" href="{{url_for('student_home')}}" aria-label="KiteClub — Αρχική"><img src="{{url_for('static',filename='img/kiteclub-logo-transparent.png')}}" alt="KiteClub"></a>
    <a class="kc-student-name" href="{{url_for('student_profile')}}">{{me.name}}</a>
    <form action="{{url_for('logout')}}" method="post"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><button type="submit">Αποσύνδεση</button></form>
  </div>
  <nav class="kc-student-mobile-nav" aria-label="Πλοήγηση μαθητή">
    <a href="{{url_for('student_home')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Αρχική</a>
    <a href="{{url_for('student')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4.5h6M9 11h6M9 15h6"/></svg>Κρατήσεις</a>
    <a href="{{url_for('student_profile',view='lessons')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 10 10-5 10 5-10 5-10-5Z"/><path d="M6 12v5c4 3 8 3 12 0v-5M22 10v7"/></svg>Μαθήματα</a>
    <a href="{{url_for('student_profile',view='photos')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Φωτογραφίες</a>
    <a href="{{url_for('student_profile')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Προφίλ</a>
    <a href="{{url_for('student_messages')}}"><svg class="kc-role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 8L22 6"/></svg>Μηνύματα</a>
  </nav>
</header>
<script>
(function(){
 function sync(){
  const profile={{url_for('student_profile')|tojson}};
  document.querySelectorAll('.kc-student-mobile-nav a').forEach(function(a){
   const u=new URL(a.href), hash=['#lessons','#photos'].includes(location.hash)?location.hash:'';
   const view=new URLSearchParams(location.search).get('view') || (hash?hash.slice(1):'');
   const active=u.pathname===location.pathname && (u.pathname!==profile || (u.searchParams.get('view')||'')===view);
   if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
 }
 sync();window.addEventListener('hashchange',sync);
})();
</script>
