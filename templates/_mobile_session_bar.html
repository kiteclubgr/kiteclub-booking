{% if me and me.role in ('student', 'instructor') %}
<div class="kc-mobile-session-bar" aria-label="Λογαριασμός {{'μαθητή' if me.role=='student' else 'εκπαιδευτή'}}">
  <span class="kc-mobile-session-role">{{'Μαθητής' if me.role=='student' else 'Εκπαιδευτής'}}</span>
  <form class="kc-mobile-logout-form" action="{{url_for('logout')}}" method="post">
    <input type="hidden" name="_csrf_token" value="{{csrf_token()}}">
    <button class="kc-mobile-logout-button" type="submit">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      <span>Αποσύνδεση</span>
    </button>
  </form>
</div>
{% endif %}
