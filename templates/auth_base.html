<!doctype html>
<html lang="{{'en' if request.endpoint == 'register' and request.args.get('lang') == 'en' else 'el'}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiteClub — {% if request.endpoint == 'login' %}Σύνδεση{% elif request.endpoint in ('forgot_password','reset_password') %}Επαναφορά κωδικού{% elif request.endpoint == 'register' and request.args.get('lang') == 'en' %}Sign up{% else %}Εγγραφή{% endif %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css', v='76.7.17.49') }}">
</head>
<body class="kc-auth-body">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="kc-messages" role="alert">{% for category, message in messages %}<p>{{ message }}</p>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
<script src="{{ url_for('static', filename='auth.js', v='76.7.17.14') }}" defer></script>
</body>
</html>
