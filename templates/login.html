{% extends "auth_base.html" %}{% block content %}
<div class="kc-auth"><section class="kc-auth-hero"><div><img src="{{url_for('static',filename='img/kiteclub-logo.png')}}" alt="KiteClub" class="kc-hero-logo"><div class="kc-auth-slogan"><em>Learn<br>with us</em><em>Ride<br>with us</em></div></div><div class="kc-auth-hero-bottom">{% include "_auth_features.html" %}</div></section><section class="kc-auth-panel"><div class="kc-auth-card"><img src="{{url_for('static',filename='img/kiteclub-logo.png')}}" alt="KiteClub logo"><h1>Σύνδεση στο KiteClub</h1><p class="hint">Αποκτήστε πρόσβαση στις κρατήσεις σας, τα μαθήματά σας, τις ενημερώσεις και το προφίλ σας.</p><form method="post" action="{{url_for('login')}}"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><label for="email">Email *</label><input type="email" id="email" name="email" autocomplete="username" placeholder="name@example.com" required><label for="password">Κωδικός πρόσβασης *</label><div class="kc-password"><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Εισάγετε τον κωδικό σας" required><button type="button" class="kc-password-toggle" aria-controls="password" aria-label="Εμφάνιση κωδικού" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button type="submit" class="kc-primary">Σύνδεση →</button></form><div class="kc-auth-divider" aria-hidden="true">ή</div><p style="text-align:center">Δεν έχετε λογαριασμό; <a href="{{url_for('register')}}">Εγγραφή εδώ</a></p></div></section></div>{% endblock %}
